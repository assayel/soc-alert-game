<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة المحلل الأمني: Mini SOC مع Wazuh</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f6;--panel:#fff;--ink:#14202e;--mut:#56687b;--line:#d3dce7;--teal:#0b8a8c;--l5:#a8690a;--l10:#c2410c;--l12:#b42318;--node:#f3f7fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1726;--panel:#16233a;--ink:#e6edf6;--mut:#8fa3b8;--line:#263752;--teal:#35c4c0;--l5:#e0a73a;--l10:#ff7a45;--l12:#ff6b6b;--node:#1b2c47}}
:root[data-theme="dark"]{--bg:#0e1726;--panel:#16233a;--ink:#e6edf6;--mut:#8fa3b8;--line:#263752;--teal:#35c4c0;--l5:#e0a73a;--l10:#ff7a45;--l12:#ff6b6b;--node:#1b2c47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;line-height:1.7}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px 36px}
h1{font-size:1.45rem;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
svg{width:100%;height:auto;display:block;direction:ltr;max-height:150px}
.node rect{fill:var(--node);stroke:var(--line);stroke-width:1.5}
.node text{fill:var(--ink);font-family:inherit;text-anchor:middle}
.node .ip{fill:var(--mut);font-size:12px;font-family:"JetBrains Mono",ui-monospace,monospace}
.lnk{stroke:var(--line);stroke-width:2;stroke-dasharray:5 4}
.hud{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:12px 0}
.hud b{font-size:1.2rem}
.ig{flex:1;min-width:180px}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:2px}
.meter div{height:100%;width:100%;transition:width .2s,background .2s}
.pause{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#msg{min-height:52px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px;color:var(--ink)}
.card{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-inline-start:6px solid var(--l5);border-radius:10px;padding:8px 10px;margin-bottom:8px;animation:in .2s}
.card.h{border-inline-start-color:var(--l10)}.card.x{border-inline-start-color:var(--l12)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.lv{min-width:34px;text-align:center;border-radius:6px;color:#fff;font-weight:700;background:var(--l5)}
.card.h .lv{background:var(--l10)}.card.x .lv{background:var(--l12)}
.t{flex:1;min-width:0}.t small{display:block;color:var(--mut)}
.bar{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
.bar u{display:block;height:100%;width:100%;background:var(--mut)}
.bt{display:flex;gap:6px}
.bt button{font:inherit;padding:7px 12px;border-radius:8px;border:0;cursor:pointer;color:#fff}
.e{background:var(--l10)}.d{background:var(--teal)}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media(max-width:560px){.card{flex-wrap:wrap}.bt{width:100%}.bt button{flex:1}}
#ov{text-align:center;padding:22px 14px}
#ov h2{margin:0 0 6px}#ov p{color:var(--mut);margin:0 auto 14px;max-width:520px}
.go{font:inherit;font-weight:700;padding:10px 24px;border-radius:8px;border:0;background:var(--teal);color:#fff;cursor:pointer}
.lb{list-style:none;padding:0;margin:8px auto;max-width:440px;text-align:start}.lb li{display:flex;gap:10px;padding:5px 8px;border-bottom:1px solid var(--line)}
.lb li span{min-width:22px;color:var(--mut)}.lb li b{flex:1}.lb li i{color:var(--mut);font-style:normal}.lb li.me{background:var(--node);border-radius:6px}
#nm{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:10px;text-align:center}#ov h3{margin:16px 0 0;font-size:1rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<h1>لعبة المحلل الأمني: Mini SOC مع Wazuh</h1>
<p class="sub">تنبيهات Wazuh عشوائية مبنية على سيناريوهات المشروع، وتزيد سرعتها مع كل مستوى</p>

<div class="panel"><svg id="svg" viewBox="0 0 640 150" role="img" aria-label="مخطط: المهاجم ثم الجهاز المراقب ثم SIEM">
<line class="lnk" x1="170" y1="75" x2="245" y2="75"/><line class="lnk" x1="395" y1="75" x2="470" y2="75"/>
<g class="node"><rect x="20" y="35" width="150" height="80" rx="10"/><text x="95" y="66" font-weight="700">Kali Linux</text><text class="ip" x="95" y="88">192.168.56.102</text></g>
<g class="node"><rect x="245" y="35" width="150" height="80" rx="10"/><text x="320" y="66" font-weight="700">Windows-Host</text><text class="ip" x="320" y="88">192.168.56.1</text></g>
<g class="node"><rect x="470" y="35" width="150" height="80" rx="10"/><text x="545" y="66" font-weight="700">Wazuh Server</text><text class="ip" x="545" y="88">192.168.56.101</text></g>
</svg></div>

<div class="hud">
<span>النقاط: <b id="sc">0</b></span><span>الأعلى: <b id="bs">—</b></span><span>المستوى: <b id="lv">1</b></span><span>التتابع: <b id="st">0</b></span>
<div class="ig">سلامة الشبكة<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="ig"></div></div></div>
<button class="pause" id="pz">إيقاف مؤقت</button>
</div>

<div id="msg" aria-live="polite">اضغط على تصعيد إذا كان التنبيه تهديداً حقيقياً، وتجاهل إذا كان نشاطاً عادياً.</div>
<div id="list"></div>

<div class="panel" id="ov"></div>
</div>

<script>
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',svg=$('#svg');
const X={k:[170,245],w:[395,470]},RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
function pulse(seg,col){const c=document.createElementNS(NS,'circle');c.setAttribute('r',5);c.setAttribute('cy',75);c.setAttribute('cx',X[seg][0]);c.style.fill=col;svg.appendChild(c);
 c.animate([{transform:'translateX(0)'},{transform:'translateX('+(X[seg][1]-X[seg][0])+'px)'}],{duration:RM?1:450}).onfinish=()=>c.remove()}
const R=n=>Math.floor(Math.random()*n),pick=a=>a[R(a.length)],IPA='192.168.56.102',hostip=()=>'192.168.56.'+(10+R(80));
const esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TH=[
{lv:10,t:()=>'Possible port scan detected from '+IPA,d:()=>'الحدث 5157 × 10 خلال 60 ثانية (القاعدة 100101)',w:'عشرة اتصالات محظورة من Kali خلال دقيقة تدل على فحص منافذ (MITRE T1046).'},
{lv:10,t:()=>'Repeated failed logins for soc-test',d:()=>'الحدث 4625 × 5 خلال 120 ثانية (القاعدة 100102)',w:'تكرار فشل الدخول للحساب نفسه قد يعني تخمين كلمة المرور (T1110).'},
{lv:12,t:()=>'Defender: Virus:DOS/EICAR_Test_File',d:()=>'الحدث 1116 (القاعدة 62123)',w:'Defender كشف ملفاً خبيثاً ويلزم التصعيد والتحقق.'},
{lv:10,t:()=>'Multiple failed RDP logons from '+IPA,d:()=>'الحدث 4625 نوع الدخول 10 × 8 خلال دقيقة',w:'محاولات دخول بعيد متتالية من Kali تدل على هجوم تخمين (T1110).'},
{lv:12,t:()=>'New local admin account created: svc-update',d:()=>'الحدث 4720 خارج نافذة التغيير',w:'حساب مدير جديد بدون طلب تغيير قد يعني أن المهاجم يثبّت وجوده (T1136).'},
{lv:12,t:()=>'Security audit log cleared on Windows-Host',d:()=>'الحدث 1102',w:'مسح سجلات الأمان علامة معروفة على إخفاء آثار الهجوم (T1070).'},
{lv:10,t:()=>'Suspicious PowerShell encoded command',d:()=>'الحدث 4104 على Windows-Host',w:'أوامر PowerShell المشفّرة تُستخدم غالباً لتنفيذ شيفرة خبيثة (T1059).'},
{lv:12,t:()=>'Microsoft Defender real-time protection disabled',d:()=>'الحدث 5001',w:'تعطيل الحماية الفورية بدون سبب محاولة لتجاوز الدفاعات (T1562).'},
{lv:10,t:()=>'Wazuh agent stopped on Windows-Host outside maintenance',d:()=>'انقطاع الاتصال مع 192.168.56.101',w:'إيقاف الوكيل خارج وقت الصيانة قد يكون محاولة لتعطيل المراقبة (T1562).'},
{lv:10,t:()=>'Scheduled task created by unknown user',d:()=>'الحدث 4698',w:'مهمة مجدولة مجهولة وسيلة شائعة للبقاء في النظام (T1053).'},
{lv:12,t:()=>'Defender: Trojan:Win32/Wacatac detected',d:()=>'الحدث 1116، الإجراء: Quarantine',w:'تم اكتشاف تروجان، ويجب التصعيد وفحص الجهاز.'}];
const BN=[
{lv:5,t:()=>'Logon Failure - Unknown user or bad password',d:()=>'الحدث 4625 × 1 (القاعدة 60122)',w:'محاولة واحدة خاطئة غالباً خطأ كتابة.'},
{lv:3,t:()=>'Scheduled Defender scan completed',d:()=>'الحدث 1001',w:'فحص دوري مجدول وطبيعي.'},
{lv:5,t:()=>'Windows Firewall blocked network traffic',d:()=>'الحدث 5157 × 1، المصدر '+hostip()+' (القاعدة 100100)',w:'حظر واحد عابر لا يكفي، فالقاعدة 100101 تحتاج 10 أحداث خلال 60 ثانية.'},
{lv:3,t:()=>'Windows update installed successfully',d:()=>'الحدث 19',w:'تحديث نظام عادي.'},
{lv:3,t:()=>'Successful logon: admin (business hours)',d:()=>'الحدث 4624',w:'دخول ناجح اعتيادي.'},
{lv:3,t:()=>'Wazuh agent restarted after update',d:()=>'الوكيل Active مجدداً',w:'إعادة تشغيل الوكيل بعد تحديث أمر طبيعي.'},
{lv:3,t:()=>'Defender security intelligence updated',d:()=>'الحدث 2000',w:'تحديث تعريفات الحماية عادي.'},
{lv:5,t:()=>'Wazuh rules reloaded by analyst',d:()=>'تحميل ملف القواعد المخصصة ضمن نافذة التغيير',w:'تعديل معتمد من فريق الـSOC.'}];

let sc=0,ig=100,done=0,dec=0,ok=0,streak=0,run=false,al=[],sp=null,name='';
const LB='socmini_lb',NM='socmini_name';
function lbGet(){try{return JSON.parse(localStorage.getItem(LB))||[]}catch(e){return []}}
function lbSave(a){try{localStorage.setItem(LB,JSON.stringify(a))}catch(e){}}
try{name=localStorage.getItem(NM)||''}catch(e){}
const lvl=()=>1+Math.floor(done/6);
function hud(){$('#sc').textContent=sc;$('#lv').textContent=lvl();$('#st').textContent=streak;const t=lbGet()[0];$('#bs').textContent=t?t.n+' ('+t.s+')':'—';
 const b=$('#ig'),v=Math.max(0,ig);b.style.width=v+'%';b.style.background=v>60?'var(--teal)':v>30?'var(--l5)':'var(--l12)';b.parentNode.setAttribute('aria-valuenow',v)}
function say(t,g){const m=$('#msg');m.textContent=t;m.style.borderColor=g?'var(--teal)':'var(--l12)'}
function lbHtml(me){const l=lbGet();return l.length?'<ol class="lb">'+l.slice(0,10).map((r,i)=>'<li'+(me===r.id?' class="me"':'')+'><span>'+(i+1)+'</span><b>'+esc(r.n)+'</b><i>'+r.s+' نقطة، مستوى '+r.l+'</i></li>').join('')+'</ol>':'<p>ما فيه نتائج بعد. ابدأ أول جولة!</p>'}
function ov(title,msg,me,fin){const o=$('#ov');o.style.display='block';
 o.innerHTML='<h2>'+title+'</h2><p>'+msg+'</p><input id="nm" maxlength="16" placeholder="اسم اللاعب" aria-label="اسم اللاعب" value="'+esc(name)+'"><br><button class="go" id="go">'+(fin?'العب من جديد':'ابدأ اللعبة')+'</button><h3>أفضل اللاعبين على هذا الجهاز</h3>'+lbHtml(me)+'<button class="pause" id="clr">مسح القائمة</button>';
 $('#go').onclick=start;$('#clr').onclick=()=>{if(confirm('مسح كل النتائج على هذا الجهاز؟')){lbSave([]);ov(title,msg,me,fin);hud()}}}
function spawn(){
 if(!run)return;
 const th=Math.random()<Math.min(.65,.45+lvl()*.02),T=pick(th?TH:BN);
 const a={th,w:T.w,age:0,ttl:Math.max(5,10-lvl()*.6)};
 if(al.length>=6)finish(al[0],'to');
 const el=document.createElement('div');el.className='card'+(T.lv>=12?' x':T.lv>=10?' h':'');
 el.innerHTML='<span class="lv">'+T.lv+'</span><div class="t"><b></b><small></small><i class="bar"><u></u></i></div><div class="bt"><button class="e">تصعيد</button><button class="d">تجاهل</button></div>';
 el.querySelector('b').textContent=T.t();el.querySelector('small').textContent=T.d();
 el.querySelector('.e').onclick=()=>finish(a,'e');el.querySelector('.d').onclick=()=>finish(a,'d');
 a.el=el;$('#list').prepend(el);al.push(a);
 if(th){pulse('k','var(--l10)');setTimeout(()=>pulse('w','var(--l10)'),460)}else pulse('w','var(--teal)');
 sp=setTimeout(spawn,Math.max(800,2600-lvl()*220)+R(700));
}
function finish(a,how){
 if(!al.includes(a))return;
 al=al.filter(q=>q!==a);a.el.remove();done++;
 let g=null;if(a.th)g=how==='e';else if(how!=='to')g=how==='d';
 if(g!==null)dec++;
 if(g){ok++;streak++;const b=streak>=3?Math.min(streak-2,5)*2:0;sc+=(a.th?10:5)+b;say('صحيح! '+a.w+(b?' (+'+b+' مكافأة تتابع)':''),1)}
 else if(g===false){streak=0;if(a.th){ig-=15;say((how==='to'?'فاتك تنبيه حقيقي. ':'تجاهلت تهديداً حقيقياً. ')+a.w,0)}else{ig-=5;sc=Math.max(0,sc-3);say('إنذار كاذب. '+a.w,0)}}
 hud();if(ig<=0)end();
}
setInterval(()=>{if(!run)return;for(const a of [...al]){a.age+=.1;a.el.querySelector('u').style.width=Math.max(0,100-a.age/a.ttl*100)+'%';if(a.age>=a.ttl)finish(a,'to')}},100);
function start(){name=($('#nm').value||'').trim().slice(0,16)||'لاعب';try{localStorage.setItem(NM,name)}catch(e){}
 sc=0;ig=100;done=0;dec=0;ok=0;streak=0;al=[];$('#list').innerHTML='';run=true;$('#ov').style.display='none';$('#pz').textContent='إيقاف مؤقت';say('ابدأ بالتصنيف، التنبيهات الأولى هادئة.',1);hud();clearTimeout(sp);spawn()}
function end(){run=false;clearTimeout(sp);const rec={id:Date.now(),n:name,s:sc,l:lvl()},lb=lbGet().concat(rec).sort((a,b)=>b.s-a.s).slice(0,20);lbSave(lb);
 const rk=lb.findIndex(r=>r.id===rec.id)+1;hud();
 ov('انتهت اللعبة','نقاطك: '+sc+' | المستوى: '+lvl()+' | الدقة: '+(dec?Math.round(ok/dec*100):0)+'% | '+(rk?'ترتيبك: '+rk:'خارج أفضل 20'),rec.id,true)}
$('#pz').onclick=()=>{if($('#ov').style.display!=='none')return;run=!run;$('#pz').textContent=run?'إيقاف مؤقت':'متابعة';if(run)sp=setTimeout(spawn,600);else clearTimeout(sp)};
hud();
ov('هل تميّز التهديد من الإنذار العادي؟','كل تنبيه له وقت محدود. تصعيد تهديد حقيقي = 10 نقاط، وتجاهل إنذار عادي = 5. الإجابات الصحيحة المتتالية تعطيك مكافأة. تجاهل تهديد أو تفويته يخفض سلامة الشبكة 15%، وتصعيد إنذار عادي يخفضها 5%.',null,false);
</script>
</body>
</html>
